html_content = """<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Materi - LUMINA LMS</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6;
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #333; 
        }
        label { 
            font-weight: bold; 
            margin-top: 15px; 
            display: block; 
            color: #555;
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            background-color: #007bff; 
            color: white; 
            padding: 12px; 
            margin-top: 20px; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #status { 
            text-align: center; 
            margin-top: 15px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Upload Modul - LUMINA</h2>
    <p style="text-align: center; color: #777;"><i>Nyalakan Nalar, Raih Masa Depan</i></p>
    
    <label>Mata Pelajaran (Contoh: Matematika - Statistika):</label>
    <input type="text" id="judulMateri" placeholder="Ketik mata pelajaran di sini">
    
    <label>Pilih File Modul (PDF):</label>
    <input type="file" id="filePdf" accept="application/pdf">
    
    <button id="btnUpload">Mulai Upload ke LUMINA</button>
    
    <div id="status"></div>
</div>

<!-- Mengambil script Firebase langsung dari internet (CDN) sehingga tidak perlu instalasi rumit -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 🔴 PENTING: GANTI KODE DI BAWAH INI DENGAN KONFIGURASI FIREBASE ANDA
    const firebaseConfig = {
        apiKey: "AIzaSyAO8Pj2d7Wt8X6mfrLudZEIZxV4CTziXUI",
  authDomain: "lumina-lms-4e451.firebaseapp.com",
  projectId: "lumina-lms-4e451",
  storageBucket: "lumina-lms-4e451.firebasestorage.app",
  messagingSenderId: "443356880708",
  appId: "1:443356880708:web:f3b37a1aeb9cfc57f70111",
  measurementId: "G-KWXHYGY23F"

    };

    // Menghidupkan Firebase
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    // Perintah saat tombol diklik
    document.getElementById("btnUpload").addEventListener("click", async () => {
        const judul = document.getElementById("judulMateri").value;
        const fileInput = document.getElementById("filePdf");
        const file = fileInput.files[0];
        const statusBox = document.getElementById("status");

        if (!judul || !file) {
            statusBox.innerHTML = "<span style='color:red;'>Mohon isi mata pelajaran dan pilih file PDF!</span>";
            return;
        }

        // Tentukan folder di storage bernama "modul_pdf"
        const storageRef = ref(storage, 'modul_pdf/' + file.name);
        const uploadTask = uploadBytesResumable(storageRef, file);

        // Proses loading upload
        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                statusBox.innerHTML = "<span style='color:blue;'>Proses Upload: " + Math.round(progress) + "%</span>";
            }, 
            (error) => {
                console.error(error);
                statusBox.innerHTML = "<span style='color:red;'>Gagal upload! Periksa pengaturan keamanan (Rules) Storage.</span>";
            }, 
            async () => {
                statusBox.innerHTML = "<span style='color:orange;'>PDF terkirim! Menyambungkan link ke Database...</span>";
                
                // Ambil link download PDF dari storage
                const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                
                try {
                    // Simpan link dan nama pelajaran ke Firestore Database
                    await addDoc(collection(db, "materi"), {
                        mata_pelajaran: judul,
                        link_pdf: downloadURL,
                        tanggal_unggah: new Date().toLocaleDateString('id-ID')
                    });
                    
                    statusBox.innerHTML = "<span style='color:green;'>Berhasil! Modul siap diakses di LUMINA.</span>";
                    
                    // Kosongkan form setelah sukses
                    document.getElementById("judulMateri").value = "";
                    fileInput.value = "";
                } catch (e) {
                    console.error(e);
                    statusBox.innerHTML = "<span style='color:red;'>Gagal menyimpan data ke Firestore Database.</span>";
                }
            }
        );
    });
</script>
</body>
</html>"""

with open('upload_lumina.html', 'w') as f:
    f.write(html_content)

print("[file-tag: upload_lumina.html]")
