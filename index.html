<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA - Nyalakan Nalar, Raih Masa Depan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @media print {
            .print\:hidden { display: none !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:text-black { color: #000 !important; }
            body { background-color: white !important; }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        .prose div { margin-bottom: 0.5rem; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden">
    
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
          BookOpen, CheckCircle, ChevronDown, ChevronRight, ChevronUp, FileText, 
          Folder, PlaySquare, Plus, CheckSquare, Trash2, Users, FileUp, 
          X, Image as ImageIcon, Link as LinkIcon, Lock, Unlock, LogOut, 
          Check, Library, Award, FileSpreadsheet, Printer, Database, Table, Copy, UploadCloud
        } from 'https://esm.sh/lucide-react@0.292.0';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // =========================================================================
        // 🔴🔴🔴 PENTING: ISI DATABASE FIREBASE ANDA DI BAWAH INI 🔴🔴🔴
        // =========================================================================
        const myFirebaseConfig = {
           apiKey: "AIzaSyAt8fb_9_p5MxCv4j59ilxVhWbevC9kbjE",
  authDomain: "database-lms-portal.firebaseapp.com",
  projectId: "database-lms-portal",
  storageBucket: "database-lms-portal.firebasestorage.app",
  messagingSenderId: "1021583607305",
  appId: "1:1021583607305:web:80edc313d0ebca37841ad8"
        };
        // =========================================================================

        let finalFirebaseConfig = null;
        if (typeof __firebase_config !== 'undefined' && Object.keys(JSON.parse(__firebase_config)).length > 0) {
            finalFirebaseConfig = JSON.parse(__firebase_config);
        } else if (myFirebaseConfig.apiKey) {
            finalFirebaseConfig = myFirebaseConfig;
        }

        const app = finalFirebaseConfig ? initializeApp(finalFirebaseConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;
        const storage = app ? getStorage(app) : null;
        const appId = 'lumina-online-db'; 

        const INITIAL_DATA = [
          {
            id: 'c1', type: 'course', title: 'Kursus 1: Contoh Materi', isOpen: true, isLocked: false,
            items: [
              {
                id: 'm1', type: 'module', title: 'Modul 1: Pengenalan', isOpen: true,
                items: [
                  { id: 'm1-1', type: 'text', title: 'Selamat Datang', content: 'Selamat datang di kursus ini.', attachment: null, attachmentType: null }
                ]
              }
            ]
          }
        ];

        const INITIAL_STUDENTS = [
          { id: 's1', name: 'Siswa Demo', nis: '1234', progress: 0 }
        ];

        function App() {
          const [firebaseUser, setFirebaseUser] = useState(null);
          
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [loginError, setLoginError] = useState('');

          const [viewMode, setViewMode] = useState('teacher'); 
          const [activeMainTab, setActiveMainTab] = useState('dashboard');
          const [studentSession, setStudentSession] = useState(null);
          
          const [data, setData] = useState(INITIAL_DATA);
          const [students, setStudents] = useState(INITIAL_STUDENTS);
          const [submissions, setSubmissions] = useState([]);
          const [questionBank, setQuestionBank] = useState([]);

          const [activeItemId, setActiveItemId] = useState(null);
          const [activeStudentCourseId, setActiveStudentCourseId] = useState(null);
          
          const [completedItems, setCompletedItems] = useState([]);
          const [studentAnswers, setStudentAnswers] = useState({});
          const [quizResults, setQuizResults] = useState({});
          const [sumatifCooldowns, setSumatifCooldowns] = useState({});
          const [currentTime, setCurrentTime] = useState(Date.now());
          
          const [studentFormMode, setStudentFormMode] = useState(null);
          const [manualForm, setManualForm] = useState({ name: '', nis: '' });
          const [massForm, setMassForm] = useState('');

          const [bankImportMode, setBankImportMode] = useState(false);
          const [bankImportText, setBankImportText] = useState('');

          const [uploadFile, setUploadFile] = useState(null);
          const [uploadStatus, setUploadStatus] = useState(''); 
          const [uploadedUrl, setUploadedUrl] = useState('');
          const fileInputRef = useRef(null);
          
          const [confirmModal, setConfirmModal] = useState({ isOpen: false, message: '', onConfirm: null });
          const [promptModal, setPromptModal] = useState({ isOpen: false, title: '', placeholder: '', type: 'text', onConfirm: null });
          const [bankSelector, setBankSelector] = useState({ isOpen: false, targetQuizId: null, selectedIds: [] }); 

          const ytContainerRef = useRef(null);
          const [canCompleteVideo, setCanCompleteVideo] = useState(true);

          useEffect(() => {
            if (!window.YT) {
              const tag = document.createElement('script');
              tag.src = "https://www.youtube.com/iframe_api";
              const firstScriptTag = document.getElementsByTagName('script')[0];
              firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }
          }, []);

          const activeItem = activeItemId ? findNode(data, activeItemId) : null;

          useEffect(() => {
            if (viewMode !== 'student' || activeItem?.type !== 'video' || !activeItem?.videoUrl) {
              setCanCompleteVideo(true);
              return;
            }

            setCanCompleteVideo(false);
            let player;
            let interval;

            const initPlayer = () => {
              if (!window.YT || !window.YT.Player) {
                setTimeout(initPlayer, 100);
                return;
              }
              if (!ytContainerRef.current) return;

              const videoId = activeItem.videoUrl.split('v=')[1]?.split('&')[0];
              if (!videoId) return;

              ytContainerRef.current.innerHTML = '';

              player = new window.YT.Player(ytContainerRef.current, {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'playsinline': 1, 'modestbranding': 1 },
                events: {
                  'onStateChange': (event) => {
                    if (event.data === window.YT.PlayerState.PLAYING) {
                      interval = setInterval(() => {
                        if (player && typeof player.getCurrentTime === 'function') {
                          const currentTime = player.getCurrentTime();
                          const duration = player.getDuration();
                          if (duration > 0 && (currentTime / duration) >= 0.5) {
                            setCanCompleteVideo(true);
                            clearInterval(interval);
                          }
                        }
                      }, 1000);
                    } else {
                      if (interval) clearInterval(interval);
                    }
                  }
                }
              });
            };

            initPlayer();

            return () => {
              if (interval) clearInterval(interval);
              if (player && typeof player.destroy === 'function') {
                 try { player.destroy(); } catch(e) {}
              }
            };
          }, [activeItemId, viewMode, activeItem?.videoUrl]);

          const generateId = () => Math.random().toString(36).substr(2, 9);

          useEffect(() => {
             const timer = setInterval(() => setCurrentTime(Date.now()), 60000); 
             return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) { console.error("Cloud Auth Error:", error); }
            };
            initAuth();
            return onAuthStateChanged(auth, (user) => setFirebaseUser(user));
          }, []);

          useEffect(() => {
            if (!firebaseUser || !db) return;
            
            const unsubData = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'curriculum'), (docSnap) => {
              if (docSnap.exists()) {
                  setData(docSnap.data().tree || []);
              } else {
                  // Menyimpan INITIAL_DATA ke Firestore jika kosong agar tidak reset terus
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'curriculum'), { tree: INITIAL_DATA });
                  setData(INITIAL_DATA);
              }
            });

            const unsubStudents = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'students'), (docSnap) => {
              if (docSnap.exists()) {
                  setStudents(docSnap.data().list || []);
              } else {
                  setStudents(INITIAL_STUDENTS);
              }
            });

            const unsubSubmissions = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'submissions'), (docSnap) => {
              if (docSnap.exists()) setSubmissions(docSnap.data().list || []);
            });

            const unsubBank = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'question_bank'), (docSnap) => {
              if (docSnap.exists()) setQuestionBank(docSnap.data().list || []);
            });

            const activeUserId = (viewMode === 'student' && studentSession) ? studentSession.nis : firebaseUser.uid;
            
            const unsubProgress = onSnapshot(doc(db, 'artifacts', appId, 'users', activeUserId, 'lumina_progress', 'state'), (docSnap) => {
              if (docSnap.exists()) {
                const d = docSnap.data();
                setCompletedItems(d.completedItems || []);
                setStudentAnswers(d.studentAnswers || {});
                setQuizResults(d.quizResults || {});
                setSumatifCooldowns(d.sumatifCooldowns || {});
              }
            });

            return () => { unsubData(); unsubStudents(); unsubSubmissions(); unsubBank(); unsubProgress(); };
          }, [firebaseUser, viewMode, studentSession]);

          const handleSetData = (newData) => {
            setData(newData);
            if (firebaseUser && db) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'curriculum'), { tree: newData });
          };
          const handleSetStudents = (newStudents) => {
            setStudents(newStudents);
            if (firebaseUser && db) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'students'), { list: newStudents });
          };
          const handleSetSubmissions = (newSubmissions) => {
            setSubmissions(newSubmissions);
            if (firebaseUser && db) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'submissions'), { list: newSubmissions });
          };
          const handleSetQuestionBank = (newBank) => {
            setQuestionBank(newBank);
            if (firebaseUser && db) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'lumina_core', 'question_bank'), { list: newBank });
          };
          
          const handleUpdateProgress = (partialUpdate) => {
            const nextCompleted = partialUpdate.completedItems !== undefined ? partialUpdate.completedItems : completedItems;
            const nextAnswers = partialUpdate.studentAnswers !== undefined ? partialUpdate.studentAnswers : studentAnswers;
            const nextResults = partialUpdate.quizResults !== undefined ? partialUpdate.quizResults : quizResults;
            const nextCooldowns = partialUpdate.sumatifCooldowns !== undefined ? partialUpdate.sumatifCooldowns : sumatifCooldowns;
            
            setCompletedItems(nextCompleted); setStudentAnswers(nextAnswers); setQuizResults(nextResults); setSumatifCooldowns(nextCooldowns);

            if (firebaseUser && db) {
              const activeUserId = (viewMode === 'student' && studentSession) ? studentSession.nis : firebaseUser.uid;
              setDoc(doc(db, 'artifacts', appId, 'users', activeUserId, 'lumina_progress', 'state'), {
                completedItems: nextCompleted, studentAnswers: nextAnswers, quizResults: nextResults, sumatifCooldowns: nextCooldowns
              }, { merge: true });
            }
          };

          const handleLogin = (e) => {
            e.preventDefault();
            if (username === 'guru' && password === '19882026') {
              setIsLoggedIn(true); setViewMode('teacher'); setActiveMainTab('dashboard'); setLoginError('');
            } else {
              const matchedStudent = students.find(s => s.nis === username && s.nis === password);
              if (matchedStudent) {
                setStudentSession(matchedStudent); setIsLoggedIn(true); setViewMode('student'); setActiveStudentCourseId(null); setActiveMainTab('curriculum'); setLoginError('');
              } else if (username === 'siswa' && password === 'siswa123') {
                setStudentSession({ name: 'Siswa Demo', nis: '9999' }); setIsLoggedIn(true); setViewMode('student'); setActiveStudentCourseId(null); setActiveMainTab('curriculum'); setLoginError('');
              } else {
                setLoginError('Username atau kata sandi salah!');
              }
            }
          };

          const handleLogout = () => {
            setIsLoggedIn(false); setUsername(''); setPassword('');
            setActiveItemId(null); setActiveStudentCourseId(null); setStudentSession(null);
            setCompletedItems([]); setStudentAnswers({}); setQuizResults({}); setSumatifCooldowns({});
          };

          const showConfirm = (message, onConfirm) => setConfirmModal({ isOpen: true, message, onConfirm });
          const showPrompt = (title, placeholder, type, onConfirm) => setPromptModal({ isOpen: true, title, placeholder, type, onConfirm });

          function findNode(nodes, id) {
            for (const node of nodes) {
              if (node.id === id) return node;
              if (node.items) { const found = findNode(node.items, id); if (found) return found; }
            }
            return null;
          }

          const getFlatActionableItems = (items) => {
            let flatList = [];
            items.forEach(item => {
              if (['text', 'video', 'document', 'quiz', 'quiz_sumatif'].includes(item.type)) flatList.push(item);
              if (item.items && item.items.length > 0) flatList = flatList.concat(getFlatActionableItems(item.items));
            });
            return flatList;
          };

          const getCourseForNode = (targetId, currentNodes = data, currentCourse = null) => {
            for (const node of currentNodes) {
              const courseContext = node.type === 'course' ? node : currentCourse;
              if (node.id === targetId) return courseContext;
              if (node.items) { const foundCourse = getCourseForNode(targetId, node.items, courseContext); if (foundCourse) return foundCourse; }
            }
            return null;
          };

          // Algoritma Penguncian Hierarki Penuh (Flatten Scan)
          const isNodeLocked = (nodeId) => {
            if (viewMode === 'teacher') return false;
            
            const courseContext = getCourseForNode(nodeId);
            if (!courseContext) return false;

            // Kumpulkan SEMUA item aksi dalam urutan dari atas ke bawah
            const allActionables = getFlatActionableItems([courseContext]);
            
            // Cek apakah ada materi sebelum node ini yang belum selesai
            let isLocked = false;
            
            // Jika yang dicek adalah folder/module, kita harus periksa semua materi SEBELUM materi PERTAMA di dalam folder ini
            const targetNode = findNode([courseContext], nodeId);
            if (!targetNode) return false;

            const targetActionables = getFlatActionableItems([targetNode]);
            if (targetActionables.length === 0) return false; // Folder kosong tidak perlu dilock

            const firstActionableIdInTarget = targetActionables[0].id;
            const targetIndex = allActionables.findIndex(item => item.id === firstActionableIdInTarget);

            if (targetIndex > 0) {
              // Periksa semua item dari index 0 sampai sebelum targetIndex
              for (let i = 0; i < targetIndex; i++) {
                if (!completedItems.includes(allActionables[i].id)) {
                  isLocked = true;
                  break;
                }
              }
            }

            return isLocked;
          };

          const handleDataChange = (id, changes) => {
            const updateNode = (nodes) => nodes.map(node => {
              if (node.id === id) return { ...node, ...changes };
              if (node.items) return { ...node, items: updateNode(node.items) };
              return node;
            });
            handleSetData(updateNode(data));
          };

          const handleMoveItem = (id, direction) => {
            const moveInArray = (arr, index, dir) => {
              const newArr = [...arr];
              if (dir === 'up' && index > 0) {
                const temp = newArr[index - 1];
                newArr[index - 1] = newArr[index];
                newArr[index] = temp;
              } else if (dir === 'down' && index < newArr.length - 1) {
                const temp = newArr[index + 1];
                newArr[index + 1] = newArr[index];
                newArr[index] = temp;
              }
              return newArr;
            };

            const traverseAndMove = (nodes) => {
              const index = nodes.findIndex(n => n.id === id);
              if (index !== -1) {
                return moveInArray(nodes, index, direction);
              }
              return nodes.map(node => {
                if (node.items) {
                  return { ...node, items: traverseAndMove(node.items) };
                }
                return node;
              });
            };

            handleSetData(traverseAndMove(data));
          };

          const toggleNode = (id) => handleDataChange(id, { isOpen: !findNode(data, id)?.isOpen });

          const handleAddCourse = () => {
            const newCourse = { id: generateId(), type: 'course', title: 'Kursus Baru', isOpen: true, isLocked: true, items: [] };
            handleSetData([...data, newCourse]); setActiveItemId(newCourse.id);
          };

          const handleAddItem = (parentId, type) => {
            const newItem = {
              id: generateId(), type: type, title: type === 'folder' ? 'Folder Baru' : type === 'module' ? 'Modul Baru' : (type === 'quiz_sumatif' ? 'Kuis Sumatif Baru' : `Materi ${type} Baru`), content: '',
              ...(type === 'folder' || type === 'module' ? { isOpen: true, items: [] } : {}),
              ...(type === 'quiz' || type === 'quiz_sumatif' ? { questions: [], showAnswerKey: true } : {})
            };
            const updateNode = (nodes) => nodes.map(node => {
              if (node.id === parentId) return { ...node, isOpen: true, items: [...(node.items || []), newItem] };
              if (node.items) return { ...node, items: updateNode(node.items) };
              return node;
            });
            handleSetData(updateNode(data)); setActiveItemId(newItem.id);
          };

          const handleDeleteItem = (id) => {
            showConfirm("Yakin ingin menghapus item ini dari sistem beserta seluruh isinya?", () => {
              const filterNodes = (nodes) => nodes.filter(node => node.id !== id).map(node => {
                if (node.items) return { ...node, items: filterNodes(node.items) };
                return node;
              });
              handleSetData(filterNodes(data)); if (activeItemId === id) setActiveItemId(null);
            });
          };

          const handleAddManualStudent = (e) => {
            e.preventDefault(); if (!manualForm.name || !manualForm.nis) return;
            handleSetStudents([...students, { id: generateId(), name: manualForm.name, nis: manualForm.nis, progress: 0 }]);
            setManualForm({ name: '', nis: '' }); setStudentFormMode(null);
          };

          const handleMassImportSubmit = () => {
            if (!massForm.trim()) return;
            const lines = massForm.split('\n'); const newStudents = [];
            lines.forEach(line => {
              if(!line.trim()) return;
              const parts = line.split(',');
              if (parts.length >= 2) newStudents.push({ id: generateId(), name: parts[0].trim(), nis: parts[1].trim(), progress: 0 });
            });
            if (newStudents.length > 0) {
              handleSetStudents([...students, ...newStudents]); setMassForm(''); setStudentFormMode(null);
            }
          };

          const handleBankImportSubmit = () => {
            if (!bankImportText.trim()) return;
            const lines = bankImportText.split('\n');
            const newQuestions = [];
            let errorCount = 0;

            lines.forEach(line => {
               if(!line.trim()) return;
               const parts = line.split(/\t|\|/).map(s => s.trim());
               if (parts.length >= 10) {
                  let type = parts[0].toLowerCase();
                  if(!['multiple_choice', 'true_false', 'essay', 'matching'].includes(type)) type = 'multiple_choice';
                  
                  const optionsArray = [parts[4], parts[5], parts[6], parts[7], parts[8]].filter(s => s && s.trim() !== '');
                  
                  const q = {
                     id: generateId(), type: type, material: parts[1] || 'Umum', subMaterial: parts[2] || 'Umum',
                     question: parts[3] || 'Soal Baru', imageUrl: '', options: type === 'multiple_choice' ? optionsArray : [],
                     correctAnswer: parts[9] || '', explanation: parts[10] || '', pairs: type === 'matching' ? [{left:'Pertanyaan A', right:'Jawaban A'}] : []
                  };
                  newQuestions.push(q);
               } else {
                  errorCount++;
               }
            });

            if (newQuestions.length > 0) {
               handleSetQuestionBank([...questionBank, ...newQuestions]); setBankImportText(''); setBankImportMode(false);
               if (errorCount > 0) showConfirm(`Berhasil mengimpor ${newQuestions.length} soal. ${errorCount} baris diabaikan karena kolom tidak lengkap.`, () => {});
               else showConfirm(`Sukses mengimpor ${newQuestions.length} soal dari Excel ke Bank Soal!`, () => {});
            } else {
               showConfirm('Format tidak valid. Pastikan copy tabel dari Excel memiliki 11 kolom berurutan.', () => {});
            }
          };

          const handleExportExcel = () => {
            const csvHeaders = ["Nama Siswa", "NIS/ID", "Judul Kuis", "Nilai Akhir"];
            const csvRows = submissions.map(row => `"${row.studentName}";"${row.nis}";"${row.quizTitle}";"${row.score}"`);
            const csvContent = "\uFEFF" + csvHeaders.join(";") + "\n" + csvRows.join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url); link.setAttribute("download", "Rekap_Nilai_Lumina.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
          };

          const handlePrint = () => {
            const printWindow = window.open('', '_blank', 'width=800,height=600');
            if (!printWindow) { showConfirm('Pop-up diblokir. Harap izinkan pop-up untuk mencetak PDF.', () => {}); return; }
            const htmlContent = `
              <!DOCTYPE html><html><head><title>Laporan Nilai LUMINA</title>
              <style>
                body { font-family: sans-serif; padding: 40px; color: #333; }
                h2 { text-align: center; color: #1e293b; margin-bottom: 5px; }
                p { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px; }
                table { width: 100%; border-collapse: collapse; font-size: 14px; }
                th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; }
                th { background-color: #f8fafc; font-weight: bold; }
                .score { font-weight: bold; text-align: center; }
                .pass { color: #047857; } .fail { color: #b91c1c; }
              </style></head><body>
              <h2>Laporan Rekap Nilai Kuis Siswa</h2><p>LUMINA - Nyalakan Nalar, Raih Masa Depan</p>
              <table><thead><tr><th>No</th><th>Nama Siswa</th><th>NIS/ID</th><th>Judul Kuis</th><th style="text-align:center;">Nilai Akhir</th></tr></thead>
              <tbody>
                ${submissions.length > 0 ? submissions.map((sub, idx) => `
                  <tr><td style="text-align: center;">${idx + 1}</td><td>${sub.studentName}</td><td>${sub.nis}</td><td>${sub.quizTitle}</td><td class="score ${sub.score >= 70 ? 'pass' : 'fail'}">${sub.score}</td></tr>
                `).join('') : '<tr><td colspan="5" style="text-align:center;">Belum ada data nilai.</td></tr>'}
              </tbody></table>
              <script>window.onload=function(){setTimeout(function(){window.print();window.close();},500);};<\/script>
              </body></html>
            `;
            printWindow.document.open(); printWindow.document.write(htmlContent); printWindow.document.close();
          };

          const handleFileUpload = async () => {
             if (!uploadFile) return;
             if (!storage) {
                showConfirm('Firebase Storage belum terhubung. Pastikan Kunci API diisi dengan benar.', ()=>{});
                return;
             }
             setUploadStatus('uploading');
             const uniqueFileName = `${Date.now()}_${uploadFile.name.replace(/\s+/g, '_')}`;
             const storageRef = ref(storage, `artifacts/${appId}/public/files/${uniqueFileName}`);
             try {
                const snapshot = await uploadBytes(storageRef, uploadFile);
                const downloadURL = await getDownloadURL(snapshot.ref);
                setUploadedUrl(downloadURL); setUploadStatus('success'); setUploadFile(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
             } catch (error) {
                setUploadStatus('error');
                showConfirm('Gagal unggah. Pastikan Aturan CORS dan Rules Firebase Storage sudah dibuka.', () => {});
             }
          };

          const handleCopyUrl = () => {
             if (uploadedUrl) {
                const textArea = document.createElement("textarea");
                textArea.value = uploadedUrl;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); showConfirm('Tautan berhasil disalin! Silakan buat Materi Dokumen, lalu Paste link ini.', () => {}); } 
                catch (err) { showConfirm('Gagal otomatis. Blok teks link lalu Copy manual.', () => {}); }
                document.body.removeChild(textArea);
             }
          };

          const countModules = (nodes) => nodes ? nodes.reduce((acc, node) => acc + (node.type === 'module' ? 1 : 0) + (node.items ? countModules(node.items) : 0), 0) : 0;
          
          const getQuizzesFromNodes = (nodes) => {
             let quizzes = [];
             if (!nodes) return quizzes;
             nodes.forEach(n => {
                if (n.type === 'quiz' || n.type === 'quiz_sumatif') quizzes.push(n);
                if (n.items) quizzes = quizzes.concat(getQuizzesFromNodes(n.items));
             });
             return quizzes;
          };

          const renderTree = (nodes, level = 0) => {
            return nodes.map((node) => {
              const isFolder = node.type === 'module' || node.type === 'folder' || node.type === 'course';
              const isActive = node.id === activeItemId;
              const isLocked = isNodeLocked(node.id); // Evaluasi lock hierarki mendalam untuk Modul & Sub-Modul
              const isCompleted = completedItems.includes(node.id);
              const isActionableNode = ['text', 'video', 'document', 'quiz', 'quiz_sumatif'].includes(node.type);
              
              let Icon = FileText;
              if (node.type === 'course') Icon = Library;
              else if (node.type === 'module') Icon = BookOpen;
              else if (node.type === 'folder') Icon = Folder;
              else if (node.type === 'video') Icon = PlaySquare;
              else if (node.type === 'quiz') Icon = CheckSquare;
              else if (node.type === 'quiz_sumatif') Icon = Award;
              else if (node.type === 'document') Icon = FileUp;

              let typeColor = 'text-slate-500';
              if (node.type === 'course') typeColor = 'text-slate-800';
              else if (node.type === 'module') typeColor = 'text-indigo-600';
              else if (node.type === 'quiz') typeColor = 'text-purple-500';
              else if (node.type === 'quiz_sumatif') typeColor = 'text-rose-600';
              
              if (isLocked && viewMode === 'student') typeColor = 'text-slate-400';

              return (
                <div key={node.id} className="select-none">
                  <div 
                    className={`flex items-center py-1.5 px-2 rounded-lg cursor-pointer mb-1 transition-colors group
                      ${isActive ? 'bg-indigo-50 border border-indigo-100' : 'hover:bg-slate-50 border border-transparent'}
                      ${isLocked && viewMode === 'student' ? 'opacity-60 cursor-not-allowed bg-slate-50' : ''}
                    `}
                    style={{ paddingLeft: `${level * 16 + 8}px` }}
                    onClick={() => {
                      if (isLocked && viewMode === 'student') return;
                      setActiveItemId(node.id);
                    }}
                  >
                    {isFolder ? (
                      <button 
                        onClick={(e) => { e.stopPropagation(); if (!(isLocked && viewMode === 'student')) toggleNode(node.id); }}
                        className={`p-1 hover:bg-slate-200 rounded shrink-0 mr-1 ${isLocked && viewMode === 'student' ? 'pointer-events-none opacity-50' : ''}`}
                      >
                        {node.isOpen && !(isLocked && viewMode === 'student') ? <ChevronDown size={14} className="text-slate-500"/> : <ChevronRight size={14} className="text-slate-500"/>}
                      </button>
                    ) : <span className="w-6 shrink-0"></span>}
                    
                    <Icon size={16} className={`shrink-0 mr-2 ${typeColor}`} />
                    <span className={`truncate text-sm flex-1 ${isActive ? 'font-semibold text-indigo-900' : 'text-slate-700'}`}>{node.title}</span>

                    {viewMode === 'teacher' && (
                      <div className="flex items-center shrink-0 ml-1 opacity-0 group-hover:opacity-100 transition-opacity gap-0.5">
                        <button onClick={(e) => { e.stopPropagation(); handleMoveItem(node.id, 'up'); }} className="text-slate-400 hover:text-indigo-600 p-1 hover:bg-indigo-100 rounded" title="Geser ke Atas"><ChevronUp size={14}/></button>
                        <button onClick={(e) => { e.stopPropagation(); handleMoveItem(node.id, 'down'); }} className="text-slate-400 hover:text-indigo-600 p-1 hover:bg-indigo-100 rounded" title="Geser ke Bawah"><ChevronDown size={14}/></button>
                      </div>
                    )}

                    <div className="flex items-center shrink-0 ml-1">
                       {isLocked && viewMode === 'student' ? <Lock size={14} className="text-slate-400" /> 
                       : isCompleted ? <CheckCircle size={14} className="text-emerald-500" /> 
                       : (isActive && viewMode === 'student' && isActionableNode) ? <Unlock size={14} className="text-blue-500" /> : null}
                    </div>
                  </div>
                  
                  {/* PENTING: Jika Modul/Folder TERKUNCI (bagi Siswa), Anak-anak/Isinya TIDAK AKAN DIRENDER sama sekali */}
                  {node.items && node.isOpen && !(isLocked && viewMode === 'student') && (
                    <div className="border-l border-slate-200 ml-5 relative">
                      {renderTree(node.items, level + 1)}
                    </div>
                  )}
                </div>
              );
            });
          };

          const renderTextWithLatex = (text) => {
            if (!text) return null;
            if (typeof text !== 'string') return text;
            
            let processedHtml = text
                .replace(/\$\$(.*?)\$\$/g, (m, p1) => `<img src="https://latex.codecogs.com/svg.latex?\\color{black}\\Large&space;${encodeURIComponent(p1.trim())}" class="inline-block mx-1 align-middle max-h-16 pointer-events-none" alt="formula"/>`)
                .replace(/\\\((.*?)\\\)/g, (m, p1) => `<img src="https://latex.codecogs.com/svg.latex?\\color{black}\\Large&space;${encodeURIComponent(p1.trim())}" class="inline-block mx-1 align-middle max-h-16 pointer-events-none" alt="formula"/>`)
                .replace(/\\\[(.*?)\\\]/g, (m, p1) => `<img src="https://latex.codecogs.com/svg.latex?\\color{black}\\Large&space;${encodeURIComponent(p1.trim())}" class="inline-block mx-1 align-middle max-h-16 pointer-events-none" alt="formula"/>`);

            processedHtml = processedHtml.replace(/\n/g, '<br/>');

            return <span dangerouslySetInnerHTML={{ __html: processedHtml }} />;
          };

          const renderSingleQuestionEditor = (q, index, updateFn, deleteFn, isBankItem = false, itemProps = {}) => {
             const applyAntiCheatProps = () => {
                if (viewMode === 'teacher') return {}; 
                return {
                  style: { WebkitUserSelect: 'none', MozUserSelect: 'none', msUserSelect: 'none', userSelect: 'none' },
                  onCopy: (e) => e.preventDefault(), onCut: (e) => e.preventDefault(), onPaste: (e) => e.preventDefault(), onContextMenu: (e) => e.preventDefault(),
                };
             };
             
             const { isSumatif, item_id, studentAnswers_local, quizResults_local, handleUpdateProgress_local, showAnswerKey } = itemProps;

             return (
              <div key={q.id} className="p-4 bg-white border border-slate-200 rounded-xl shadow-sm relative mb-4" {...applyAntiCheatProps()}>
                
                {isBankItem && viewMode === 'teacher' && (
                  <div className="flex gap-4 mb-4 pb-4 border-b border-slate-100">
                    <div className="flex-1">
                      <label className="text-xs font-bold text-slate-500 block mb-1">Kategori / Materi</label>
                      <input type="text" value={q.material || ''} onChange={(e)=>updateFn(q.id, {material: e.target.value})} className="w-full border rounded p-1.5 text-sm" placeholder="Contoh: Matematika" />
                    </div>
                    <div className="flex-1">
                      <label className="text-xs font-bold text-slate-500 block mb-1">Sub Materi</label>
                      <input type="text" value={q.subMaterial || ''} onChange={(e)=>updateFn(q.id, {subMaterial: e.target.value})} className="w-full border rounded p-1.5 text-sm" placeholder="Contoh: Aljabar" />
                    </div>
                  </div>
                )}

                <div className="absolute top-4 right-4 flex gap-2">
                  <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md uppercase tracking-wider">{q.type.replace('_', ' ')}</span>
                  {viewMode === 'teacher' && (
                    <button onClick={() => showConfirm("Hapus soal ini?", () => deleteFn(q.id))} className="text-red-400 hover:text-red-600 p-1 bg-red-50 rounded-md">
                      <Trash2 size={16} />
                    </button>
                  )}
                </div>

                <div className="mb-4 pr-24">
                  <div className="flex justify-between items-end mb-1">
                    <label className="block text-sm font-bold text-slate-700">Soal {index !== undefined ? index + 1 : ''}</label>
                    {viewMode === 'teacher' && (
                      <div className="flex gap-2">
                        <button onClick={() => showPrompt("URL Gambar", "https://contoh.com/gambar.jpg", "text", (url) => { if(url) updateFn(q.id, { imageUrl: url }); })} className="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded font-medium flex items-center gap-1"><ImageIcon size={12}/> + Gambar</button>
                        <button onClick={() => showPrompt("Ketik LaTeX (Tanpa $$)", "E = mc^2", "textarea", (latex) => { if(latex) updateFn(q.id, { question: q.question + ` $$${latex}$$` }); })} className="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded font-medium flex items-center gap-1"><span className="font-serif italic font-bold">f(x)</span> + LaTeX</button>
                      </div>
                    )}
                  </div>
                  
                  {viewMode === 'teacher' ? (
                    <>
                      <textarea value={q.question} onChange={(e) => updateFn(q.id, {question: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:border-indigo-500 min-h-[80px] mb-2" placeholder="Ketik pertanyaan (Gunakan $$...$$ untuk rumus matematika)..." />
                      {(q.question.includes('$$') || q.question.includes('[LATEX:') || q.question.includes('\\(')) && (
                        <div className="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800"><span className="font-bold text-slate-500 text-xs block mb-1">Preview Soal:</span>{renderTextWithLatex(q.question)}</div>
                      )}
                    </>
                  ) : <div className="text-slate-800 font-medium pointer-events-none">{renderTextWithLatex(q.question)}</div>}
                  
                  {q.imageUrl && (
                    <div className="mt-3 relative inline-block max-w-full">
                      <img src={q.imageUrl} alt="Gambar Soal" className="max-h-[300px] rounded-lg border border-slate-200 shadow-sm pointer-events-none" draggable="false" />
                      {viewMode === 'teacher' && (
                        <button onClick={() => showConfirm("Hapus gambar?", () => updateFn(q.id, {imageUrl: ''}))} className="absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-md shadow-sm pointer-events-auto"><Trash2 size={14} /></button>
                      )}
                    </div>
                  )}
                </div>

                {q.type === 'multiple_choice' && (
                  <div className="space-y-2 ml-4">
                    <p className="text-sm font-bold text-slate-600 mb-2">Pilihan Jawaban:</p>
                    {q.options.map((opt, optIndex) => (
                      <div key={optIndex} className="flex items-center gap-2">
                        {viewMode === 'teacher' ? (
                          <>
                            <input type="radio" name={`correct-${q.id}`} checked={q.correctAnswer === opt} onChange={() => updateFn(q.id, {correctAnswer: opt})} className="w-4 h-4 text-indigo-600"/>
                            <input type="text" value={opt} onChange={(e) => {
                                const newOpts = [...q.options]; newOpts[optIndex] = e.target.value;
                                const newCorrect = q.correctAnswer === opt ? e.target.value : q.correctAnswer;
                                updateFn(q.id, {options: newOpts, correctAnswer: newCorrect});
                              }} className="flex-1 border-b border-slate-200 p-1 text-sm outline-none focus:border-indigo-500" placeholder="Jawaban... (Bisa pakai $$...$$)"/>
                            <button onClick={() => showConfirm("Hapus Opsi?", () => updateFn(q.id, {options: q.options.filter((_, i) => i !== optIndex)}))} className="text-slate-400 hover:text-red-500"><X size={14}/></button>
                          </>
                        ) : (
                          <label className="flex items-center gap-2 cursor-pointer w-full p-2 hover:bg-slate-50 rounded border border-transparent">
                            <input type="radio" name={`student-${q.id}`} disabled={quizResults_local[item_id] !== undefined} checked={studentAnswers_local[`${item_id}-${q.id}`] === opt} onChange={() => handleUpdateProgress_local({studentAnswers: {...studentAnswers_local, [`${item_id}-${q.id}`]: opt}})} className="w-4 h-4 text-indigo-600 shrink-0"/>
                            <span className="text-sm pointer-events-none flex-1 flex flex-wrap items-center gap-y-1">{renderTextWithLatex(opt)}</span>
                          </label>
                        )}
                      </div>
                    ))}
                    {viewMode === 'teacher' && (
                      <button onClick={() => updateFn(q.id, {options: [...q.options, `Opsi ${q.options.length + 1}`]})} className="text-xs font-bold text-indigo-600 flex items-center gap-1 mt-2 hover:bg-indigo-50 px-2 py-1 rounded pointer-events-auto"><Plus size={14}/> Tambah Opsi Lain</button>
                    )}
                  </div>
                )}

                {q.type === 'true_false' && (
                  <div className="space-y-2 ml-4">
                    <p className="text-sm font-bold text-slate-600 mb-2">Jawaban Benar:</p>
                    {['Benar', 'Salah'].map((opt) => (
                      <div key={opt} className="flex items-center gap-2">
                        {viewMode === 'teacher' ? (
                          <label className="flex items-center gap-2 cursor-pointer"><input type="radio" name={`correct-${q.id}`} checked={q.correctAnswer === opt} onChange={() => updateFn(q.id, {correctAnswer: opt})} /><span className="text-sm">{opt}</span></label>
                        ) : (
                          <label className="flex items-center gap-2 cursor-pointer w-full p-2 hover:bg-slate-50 rounded"><input type="radio" name={`student-${q.id}`} disabled={quizResults_local[item_id] !== undefined} checked={studentAnswers_local[`${item_id}-${q.id}`] === opt} onChange={() => handleUpdateProgress_local({studentAnswers: {...studentAnswers_local, [`${item_id}-${q.id}`]: opt}})} /><span className="text-sm">{opt}</span></label>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {q.type === 'essay' && (
                  <div className="ml-4 mt-2">
                    {viewMode === 'teacher' ? (
                      <textarea value={q.correctAnswer} onChange={(e) => updateFn(q.id, {correctAnswer: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:border-indigo-500 min-h-[60px]" placeholder="Keyword kunci jawaban (Bisa pakai $$...$$)..." />
                    ) : (
                      <textarea disabled={quizResults_local[item_id] !== undefined} value={studentAnswers_local[`${item_id}-${q.id}`] || ''} onChange={(e) => handleUpdateProgress_local({studentAnswers: {...studentAnswers_local, [`${item_id}-${q.id}`]: e.target.value}})} className="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-indigo-500 min-h-[100px] select-text pointer-events-auto" placeholder="Ketik jawaban Anda..." />
                    )}
                  </div>
                )}

                {q.type === 'matching' && (
                  <div className="ml-4 mt-2">
                    <p className="text-sm font-bold text-slate-600 mb-2">Pasangan Kunci Jawaban:</p>
                    <div className="space-y-2">
                      {q.pairs?.map((pair, pIdx) => (
                        <div key={pIdx} className="flex gap-2 items-center">
                          {viewMode === 'teacher' ? (
                            <><input type="text" value={pair.left} onChange={(e) => { const np = [...q.pairs]; np[pIdx].left = e.target.value; updateFn(q.id, {pairs: np}); }} className="flex-1 border p-1 rounded text-sm" placeholder="Sisi Kiri (Mendukung $$...$$)" /><span className="text-slate-400">{'->'}</span><input type="text" value={pair.right} onChange={(e) => { const np = [...q.pairs]; np[pIdx].right = e.target.value; updateFn(q.id, {pairs: np}); }} className="flex-1 border p-1 rounded text-sm" placeholder="Sisi Kanan (Khusus teks)" /><button onClick={() => showConfirm("Hapus?", () => updateFn(q.id, {pairs: q.pairs.filter((_, i) => i !== pIdx)}))} className="text-red-400 p-1"><X size={14}/></button></>
                          ) : (
                            <><div className="flex-1 p-2 bg-slate-50 border rounded text-sm flex flex-wrap items-center">{renderTextWithLatex(pair.left)}</div><span className="text-slate-400 mx-2">{'->'}</span>
                              <select disabled={quizResults_local[item_id] !== undefined} value={studentAnswers_local[`${item_id}-${q.id}-pair${pIdx}`] || ''} onChange={(e) => handleUpdateProgress_local({studentAnswers: {...studentAnswers_local, [`${item_id}-${q.id}-pair${pIdx}`]: e.target.value}})} className="flex-1 border p-2 rounded text-sm bg-white pointer-events-auto">
                                <option value="">-- Pilih --</option>
                                {[...q.pairs].map(p=>p.right).sort().map((opt, idx) => <option key={idx} value={opt}>{opt}</option>)}
                              </select>
                            </>
                          )}
                        </div>
                      ))}
                      {viewMode === 'teacher' && <button onClick={() => updateFn(q.id, {pairs: [...(q.pairs||[]), {left: 'Baru', right: 'Baru'}]})} className="text-xs text-indigo-600 mt-2 font-bold flex items-center gap-1"><Plus size={14}/> Tambah Pasangan</button>}
                    </div>
                  </div>
                )}

                {viewMode === 'teacher' ? (
                  <div className="mt-4 pt-4 border-t border-slate-100">
                    <label className="block text-xs font-bold text-slate-500 mb-1">Pembahasan (Mendukung rumus $$...$$):</label>
                    <textarea value={q.explanation || ''} onChange={(e) => updateFn(q.id, {explanation: e.target.value})} className="w-full border border-amber-200 bg-amber-50/30 rounded-lg p-2 text-sm outline-none min-h-[60px]" placeholder="Tulis penjelasan..." />
                  </div>
                ) : !isBankItem && quizResults_local[item_id] !== undefined && !isSumatif && showAnswerKey !== false && (
                  <div className="mt-3">
                    {q.type !== 'essay' && (
                       <div className={`p-2 text-sm rounded border flex flex-wrap items-center gap-1 ${ (q.type === 'multiple_choice' || q.type === 'true_false' ? (studentAnswers_local[`${item_id}-${q.id}`] === q.correctAnswer) : true) ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}`}>
                         {q.type === 'multiple_choice' || q.type === 'true_false' ? (studentAnswers_local[`${item_id}-${q.id}`] === q.correctAnswer ? <><CheckCircle size={16} className="shrink-0"/> <span className="pt-0.5">Benar</span></> : <><X size={16} className="shrink-0"/> <span className="pt-0.5">Salah. Kunci:</span> <b className="flex items-center bg-white px-1 rounded shadow-sm">{renderTextWithLatex(q.correctAnswer)}</b></>) : <span>Lihat Kunci Jawaban / Review Manual</span>}
                       </div>
                    )}
                    {q.explanation && <div className="mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg"><p className="text-xs font-bold text-amber-800 mb-1">Pembahasan:</p><div className="text-sm text-amber-900 leading-relaxed">{renderTextWithLatex(q.explanation)}</div></div>}
                  </div>
                )}
              </div>
             );
          };

          const renderQuizEditor = (item) => {
            const isSumatif = item.type === 'quiz_sumatif';
            const questions = item.questions || [];
            
            const updateQuestion = (qId, changes) => handleDataChange(item.id, { questions: questions.map(q => q.id === qId ? { ...q, ...changes } : q) });
            const deleteQuestion = (qId) => handleDataChange(item.id, { questions: questions.filter(quest => quest.id !== qId) });

            const handleQuizSubmit = () => {
               let correctCount = 0;
               questions.forEach(q => {
                  if (q.type === 'multiple_choice' || q.type === 'true_false') {
                     if (studentAnswers[`${item.id}-${q.id}`] === q.correctAnswer) correctCount++;
                  } else if (q.type === 'matching') {
                     let pairCorrect = 0;
                     q.pairs.forEach((p, idx) => {
                        if(studentAnswers[`${item.id}-${q.id}-pair${idx}`] === p.right) pairCorrect++;
                     });
                     if(pairCorrect === q.pairs.length && q.pairs.length > 0) correctCount++;
                  }
               });
               
               const maxScore = questions.length > 0 ? questions.length : 1;
               const finalScore = Math.round((correctCount / maxScore) * 100);

               let updates = { quizResults: { ...quizResults, [item.id]: finalScore } };
               
               if (isSumatif) {
                  if (finalScore === 100) updates.completedItems = [...completedItems, item.id];
                  else updates.sumatifCooldowns = { ...sumatifCooldowns, [item.id]: Date.now() };
               } else {
                  updates.completedItems = [...completedItems, item.id];
               }
               handleUpdateProgress(updates);

               const sName = studentSession ? studentSession.name : 'Siswa Demo';
               const sNis = studentSession ? studentSession.nis : '9999';

               handleSetSubmissions([...submissions, { id: generateId(), studentName: sName, nis: sNis, quizTitle: item.title, score: finalScore }]);
            };

            return (
              <div className="space-y-6 mt-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-2 gap-2">
                  <h3 className="font-bold text-lg text-slate-800">Daftar Soal {isSumatif ? 'Sumatif' : 'Kuis Latihan'}</h3>
                  {viewMode === 'teacher' && !isSumatif && (
                    <label className="flex items-center gap-2 px-3 py-1.5 bg-indigo-50 border border-indigo-100 rounded-lg cursor-pointer hover:bg-indigo-100 transition-colors shadow-sm">
                      <input type="checkbox" checked={item.showAnswerKey !== false} onChange={(e) => handleDataChange(item.id, { showAnswerKey: e.target.checked })} className="w-4 h-4 text-indigo-600 rounded cursor-pointer"/>
                      <span className="text-xs font-bold text-indigo-900">Tampilkan Kunci & Pembahasan ke Siswa</span>
                    </label>
                  )}
                </div>
                
                {questions.length === 0 ? <p className="text-slate-500 italic text-sm">Belum ada soal ditambahkan.</p> : (
                  <div>
                    {questions.map((q, index) => renderSingleQuestionEditor(q, index, updateQuestion, deleteQuestion, false, {
                       isSumatif, item_id: item.id, studentAnswers_local: studentAnswers, quizResults_local: quizResults, handleUpdateProgress_local: handleUpdateProgress, showAnswerKey: item.showAnswerKey !== false
                    }))}
                  </div>
                )}

                {viewMode === 'teacher' && (

                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<u>' + v.substring(s,e) + '</u>' + v.substring(e) }); setTimeout(() => { t.focus(); t.setSelectionRange(s+3, e+7); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 underline" title="Garis Bawah">U</button>
                                  <div className="w-px h-6 bg-slate-300 mx-1"></div>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<div style="text-align: left;">' + v.substring(s,e) + '</div>' + v.substring(e) }); setTimeout(() => { t.focus(); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100">Kiri</button>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<div style="text-align: center;">' + v.substring(s,e) + '</div>' + v.substring(e) }); setTimeout(() => { t.focus(); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100">Tengah</button>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<div style="text-align: right;">' + v.substring(s,e) + '</div>' + v.substring(e) }); setTimeout(() => { t.focus(); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100">Kanan</button>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<div style="text-align: justify;">' + v.substring(s,e) + '</div>' + v.substring(e) }); setTimeout(() => { t.focus(); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100">Kiri-Kanan</button>
                                  <div className="w-px h-6 bg-slate-300 mx-1"></div>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<h2>' + v.substring(s,e) + '</h2>' + v.substring(e) }); setTimeout(() => { t.focus(); t.setSelectionRange(s+4, e+9); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-bold">Judul Besar</button>
                                  <button onMouseDown={(e) => e.preventDefault()} onClick={() => { const t=document.getElementById('main-editor'); const s=t.selectionStart; const e=t.selectionEnd; const v=t.value; handleDataChange(activeItem.id, { content: v.substring(0,s) + '<h3>' + v.substring(s,e) + '</h3>' + v.substring(e) }); setTimeout(() => { t.focus(); t.setSelectionRange(s+4, e+9); }, 0); }} className="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold">Judul Sedang</button>
                                </div>
                                <textarea
                                  id="main-editor"
                                  value={activeItem.content || ''}
                                  onChange={(e) => handleDataChange(activeItem.id, { content: e.target.value })}
                                  className="w-full min-h-[300px] p-4 outline-none resize-y font-mono text-sm bg-slate-50"
                                  placeholder="Blok teks yang ingin diubah formatnya, lalu klik tombol format di atas. Tekan Enter untuk membuat baris baru."
                                />
                              </div>
                            ) : (
                              <div className="prose prose-slate max-w-none prose-headings:font-bold prose-a:text-indigo-600 leading-relaxed">
                                {renderTextWithLatex(activeItem.content || '<p class="text-slate-400 italic">Belum ada konten.</p>')}
                              </div>
                            )}
                            
                            {/* PDF EMBEDDING DENGAN ANTI-DOWNLOAD SHIELD (Mode Kios) */}
                            {['text', 'document'].includes(activeItem.type) && (
                              <div className="mt-8 pt-6 border-t border-slate-200">
                                 <h3 className="font-bold text-sm text-slate-700 mb-3">Lampiran File (PDF/Gambar/Google Drive)</h3>
                                 {viewMode === 'teacher' && (
                                     <input 
                                         type="text" 
                                         placeholder="URL File (Contoh: Link Google Drive, Tautan Upload Cloud, atau akhiran .pdf)..." 
                                         value={activeItem.attachment || ''} 
                                         onChange={(e) => {
                                             const val = e.target.value;
                                             const isPdfOrDrive = val.toLowerCase().endsWith('.pdf') || val.includes('drive.google.com') || val.includes('docs.google.com') || val.includes('firebasestorage.googleapis.com');
                                             handleDataChange(activeItem.id, { attachment: val, attachmentType: isPdfOrDrive ? 'pdf' : 'image' });
                                         }} 
                                         className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 mb-4" 
                                     />
                                 )}
                                 
                                 {activeItem.attachment && (
                                   <div 
                                     className={`border border-slate-200 rounded-xl overflow-hidden bg-slate-50 flex items-center justify-center relative ${activeItem.attachmentType === 'pdf' ? 'w-full shadow-inner' : ''}`} 
                                     style={activeItem.attachmentType === 'pdf' ? { height: '80vh', minHeight: '500px', WebkitOverflowScrolling: 'touch' } : {}}
                                   >
                                     {activeItem.attachmentType === 'pdf' ? (() => {
                                         let embedUrl = activeItem.attachment;
                                         if (embedUrl.includes('drive.google.com/file/d/')) {
                                             const match = embedUrl.match(/[-\w]{25,}/);
                                             if (match) embedUrl = `https://drive.google.com/file/d/${match[0]}/preview`;
                                         } else {
                                             // HIDE TOOLBAR: Tambahkan parameter agar browser menyembunyikan tombol native download
                                             if (embedUrl.includes('#')) {
                                                 embedUrl = embedUrl.split('#')[0] + "#toolbar=0&navpanes=0&scrollbar=0";
                                             } else {
                                                 embedUrl = embedUrl + "#toolbar=0&navpanes=0&scrollbar=0";
                                             }
                                         }
                                         
                                         return (
                                             <div className="w-full h-full relative">
                                                 {/* ANTI-CLICK SHIELD: Perisai kaca transparan yang menutupi area atas PDF khusus untuk Siswa */}
                                                 {viewMode === 'student' && (
                                                     <div 
                                                         className="absolute top-0 left-0 w-full h-14 bg-transparent z-10" 
                                                         onContextMenu={(e) => e.preventDefault()} 
                                                         title="Dokumen Dilindungi">
                                                     </div>
                                                 )}
                                                 <iframe 
                                                     src={embedUrl} 
                                                     className="absolute top-0 left-0 w-full h-full border-0" 
                                                     title="Document Viewer" 
                                                     allowFullScreen
                                                 ></iframe>
                                             </div>
                                         );
                                     })() : (
                                         <div className="p-4 flex justify-center"><img src={activeItem.attachment} alt="Lampiran" className="max-w-full h-auto rounded-lg shadow-sm" /></div>
                                     )}
                                   </div>
                                 )}
                              </div>
                            )}
                          </div>
                        )}

                        {activeItem.type === 'video' && (
                          <div className="space-y-6 mt-6">
                            <div><label className="block text-sm font-bold text-slate-700 mb-2">Tautan YouTube</label>
                              {viewMode === 'teacher' ? <input type="text" value={activeItem.videoUrl || ''} onChange={(e) => handleDataChange(activeItem.id, { videoUrl: e.target.value })} className="w-full border-2 rounded-lg p-3 outline-none focus:border-indigo-500" placeholder="https://www.youtube.com/watch?v=..." /> : <div className="p-3 bg-slate-100 rounded-lg text-sm text-slate-600 flex items-center gap-2"><LinkIcon size={16} /> {activeItem.videoUrl || 'Belum ada tautan'}</div>}
                            </div>
                            {activeItem.videoUrl?.includes('watch?v=') && (
                              <div className="aspect-video w-full rounded-xl overflow-hidden shadow-lg bg-black relative">
                                {viewMode === 'student' ? (
                                   <div ref={ytContainerRef} className="absolute inset-0 w-full h-full"></div>
                                ) : (
                                   <iframe className="absolute inset-0 w-full h-full" src={`https://www.youtube.com/embed/${activeItem.videoUrl.split('v=')[1].split('&')[0]}`} title="Video" frameBorder="0" allowFullScreen></iframe>
                                )}
                              </div>
                            )}
                          </div>
                        )}

                        {['quiz', 'quiz_sumatif'].includes(activeItem.type) && renderQuizEditor(activeItem)}

                        {viewMode === 'student' && ['text', 'video', 'document'].includes(activeItem.type) && (
                          <div className="mt-12 pt-6 border-t border-slate-200 flex justify-end">
                            {activeItem.type === 'video' && !completedItems.includes(activeItem.id) && !canCompleteVideo ? (
                               <div className="px-8 py-3 rounded-xl font-bold flex items-center gap-2 bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200 shadow-inner">
                                  <Lock size={20} /> Tonton video minimal 50% untuk lanjut
                               </div>
                            ) : (
                               <button onClick={() => { if(!completedItems.includes(activeItem.id)) handleUpdateProgress({completedItems: [...completedItems, activeItem.id]}) }} disabled={completedItems.includes(activeItem.id)} className={`px-8 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-md ${completedItems.includes(activeItem.id) ? 'bg-emerald-100 text-emerald-700 shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white transform hover:-translate-y-0.5'}`}>
                                 {completedItems.includes(activeItem.id) ? <><CheckCircle size={20} /> Selesai Dibaca</> : <><Check size={20} /> Tandai Selesai & Lanjut</>}
                               </button>
                            )}
                          </div>
                        )}
                    </div>
                  )}
                </main>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
